<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>html list</title>
</head>
<body>
    <!-- ordered list -->
     <H2>proteins</H2>
    <ol>
        <li>egg</li>
        <li>meat</li>
        <li>fish</li>
    </ol>

    <!-- unordered list -->
     <h3>fruits</h3>
    <ul>
        <li>apple</li>
        <li>banana</li>
        <li>orange</li>
    </ul>
    <!-- description list -->
     <dl>
        <dt>html</dt>
        <dd>hypertext markup language</dd>
        <dt>css</dt>
        <dd>cascading style sheets</dd>
     </dl>
     <!-- nested list -->
     <h4>restorant and menu</h4>

    <ol type="i"> 
        <li>burger</li>
        <li>pizza
            <ul>
                <li>cheese pizza</li>
                <li>pepperoni pizza</li>
            </ul>
        </li>
        <li>pasta 
            <ul>
                <li>spaghetti</li>
                <li>fettuccine</li>
            </ul>
        </li>
    </ol>
</body>
</html>
