<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a simple form</title>
    <link rel="stylesheet" href="css/formstyle.css">
</head>
<body>
    <h2>a simpleform</h2>
    <form >
        <label for="xy">name</label>
        <input type="text" id="xy" name="xy" placeholder="enter you name " required><br><br>
        <label for="email">email address</label>
        <input type="email" id="email" name="email" placeholder="enter you email"><br><br>
        <label for="num">phonenumber</label>
        <input type="tel" id="num" name="num" value="+254" placeholder="07xxxxxxxx"><br><br>

        <button type="submit">send</button>
    </form>
    
</body>
</html>
